<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open-Comm App</title>
    <script src="https://tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans h-screen flex flex-col">

    <!-- Join Screen Container -->
    <div id="join-container" class="flex-1 flex items-center justify-center">
        <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-96">
            <h2 class="text-2xl font-bold mb-6 text-center text-indigo-400">Join Meeting</h2>
            <input id="nickname-input" type="text" placeholder="Enter Nickname" class="w-full p-3 rounded bg-gray-700 border border-gray-600 mb-4 focus:outline-none focus:border-indigo-500">
            <input id="room-input" type="text" placeholder="Room Name (e.g. engineering)" class="w-full p-3 rounded bg-gray-700 border border-gray-600 mb-6 focus:outline-none focus:border-indigo-500">
            <button id="join-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded font-semibold transition">Enter Room</button>
        </div>
    </div>

    <!-- Interface Room Layout (Hidden until Joined) -->
    <div id="room-container" class="hidden flex-1 flex overflow-hidden">
        <!-- Sidebar: User List & Chat -->
        <div class="w-80 bg-gray-800 flex flex-col border-r border-gray-700">
            <div class="p-4 border-b border-gray-700">
                <h3 class="font-bold text-lg text-indigo-300">Active Participants</h3>
                <ul id="user-list" class="mt-2 space-y-1 text-sm text-gray-300"></ul>
            </div>
            <div class="flex-1 p-4 flex flex-col overflow-hidden">
                <h3 class="font-bold text-lg mb-2 text-indigo-300">In-Meeting Chat</h3>
                <div id="chat-box" class="flex-1 overflow-y-auto mb-2 space-y-2 text-sm bg-gray-900 p-2 rounded border border-gray-700"></div>
                <div class="flex gap-2">
                    <input id="chat-input" type="text" placeholder="Type message..." class="flex-1 p-2 rounded bg-gray-700 text-xs border border-gray-600 focus:outline-none">
                    <button id="send-chat-btn" class="bg-indigo-600 px-3 py-1 rounded text-xs font-medium hover:bg-indigo-700">Send</button>
                </div>
            </div>
        </div>

        <!-- Central Stage Main Stream Grid -->
        <div class="flex-1 flex flex-col bg-gray-950 relative">
            <div id="video-grid" class="flex-1 p-6 grid grid-cols-2 gap-4 auto-rows-fr overflow-y-auto">
                <!-- Local and remote video streams will dynamically append here -->
            </div>
            
            <!-- Universal Device Control Dock Bar -->
            <div class="h-20 bg-gray-900 border-t border-gray-800 flex items-center justify-center gap-6">
                <button id="audio-toggle" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-full font-medium text-sm transition">Mute Mic</button>
                <button id="screen-share-toggle" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2 rounded-full font-bold text-sm transition">Share Screen + Audio</button>
                <button id="leave-btn" class="bg-red-600 hover:bg-red-500 px-6 py-2 rounded-full font-medium text-sm transition">Leave</button>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
